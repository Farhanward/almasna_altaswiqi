[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almasna-altaswiqi"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Local marketing brief factory."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
almasna-altaswiqi = "almasna_altaswiqi.cli:main"

[tool.setuptools]
packages = ["almasna_altaswiqi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
